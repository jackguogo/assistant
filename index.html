                    <>
                      <div className="fixed inset-0 z-40" onClick={() => setShowTermMenu(false)}></div>
                      <div className="absolute right-0 top-full mt-2 w-72 bg-white border border-slate-200 rounded-xl shadow-2xl py-2 z-50 animate-in fade-in zoom-in-95">
                        <div className="px-4 py-2 text-xs font-bold text-slate-400 border-b border-slate-100 mb-1">切换全局业务学期</div>
                        <div className="max-h-[60vh] overflow-y-auto custom-scrollbar">
                          {terms.map(t => (
                             <button key={t.id} onClick={(e) => { e.stopPropagation(); setGlobalTermId(t.id); setShowTermMenu(false); }} className="w-full text-left px-4 py-3 text-sm hover:bg-slate-50 transition-colors flex items-center justify-between group">
                               <span className={`font-bold transition-colors truncate pr-2 ${globalTermId === t.id ? 'text-indigo-600' : 'text-slate-700 group-hover:text-indigo-600'}`}>{t.name}</span>
                               {t.status === 'active' ? <span className="text-[10px] bg-emerald-50 text-emerald-600 px-1.5 py-0.5 rounded border border-emerald-100 flex items-center gap-1 shrink-0"><span className="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span>进行中</span> : <span className="text-[10px] bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded border border-slate-200 shrink-0">已归档</span>}
                             </button>
                          ))}
                        </div>
                      </div>
                    </>
                  )}
                </div>
              )}
            </header>
            <main className="flex-1 overflow-hidden relative z-0">
              {activeTab === 'dashboard' && <DashboardView globalTerm={globalTerm} isReadOnly={isReadOnly} onOpenStudentProfile={setSelectedStudentId} onOpenNewTask={() => setShowNewTaskModal(true)} setActiveTab={setActiveTab} />}
              {activeTab === 'students' && <StudentsView isReadOnly={isReadOnly} onOpenStudentProfile={setSelectedStudentId} />}
              {activeTab === 'interactive' && <InteractiveRoomView isReadOnly={isReadOnly} />}
              {activeTab === 'analytics' && <AnalyticsView isReadOnly={isReadOnly} onOpenStudentProfile={setSelectedStudentId} />}
              {activeTab === 'course' && <CourseAndTasksView globalTermId={globalTermId} setGlobalTermId={setGlobalTermId} terms={terms} setTerms={setTerms} onOpenNewTask={() => setShowNewTaskModal(true)} />}
              {activeTab === 'dataManagement' && <DataManagementView />}
              {activeTab === 'settings' && <SettingsView />}
            </main>
          </div>
          {selectedStudentId && <StudentProfileDrawer studentId={selectedStudentId} onClose={() => setSelectedStudentId(null)} />}
          
          {showNewTaskModal && (
            <div className="fixed inset-0 z-[70] flex items-center justify-center bg-slate-900/60 p-8 backdrop-blur-sm">
               <div className="bg-white w-[760px] max-w-full rounded-3xl shadow-2xl flex flex-col overflow-hidden animate-in zoom-in-95 duration-200">
                  <div className="p-6 bg-indigo-50/50 border-b border-indigo-100 flex justify-between items-center">
                    <h2 className="font-black text-indigo-900 flex items-center gap-2"><Icon name="add_task" className="text-indigo-600" /> 发布新任务与测评</h2>
                    <button onClick={() => setShowNewTaskModal(false)} className="text-slate-400 hover:text-indigo-600 transition-colors"><Icon name="close" style={{fontSize: '18px'}}/></button>
                  </div>
                  <div className="p-8">
                     <div className="flex gap-4 mb-6">
                       <label className={`flex-1 p-4 border rounded-2xl cursor-pointer transition-all ${newTaskType === '作业' ? 'border-indigo-500 bg-indigo-50 shadow-md ring-1 ring-indigo-500' : 'border-slate-200 hover:bg-slate-50'}`}>
                         <input type="radio" className="sr-only" checked={newTaskType === '作业'} onChange={() => setNewTaskType('作业')} />
                         <div className="flex items-center gap-3">
                           <div className={`w-12 h-12 rounded-xl flex items-center justify-center shrink-0 ${newTaskType === '作业' ? 'bg-indigo-500 text-white shadow-inner' : 'bg-slate-100 text-slate-400'}`}><Icon name="edit_document" style={{fontSize: '24px'}}/></div>
                           <div><p className={`font-black text-sm mb-0.5 ${newTaskType === '作业' ? 'text-indigo-900' : 'text-slate-700'}`}>课程作业</p><p className={`text-[10px] ${newTaskType === '作业' ? 'text-indigo-600' : 'text-slate-500'}`}>主题短文、反思报告等</p></div>
                         </div>
                       </label>
                       <label className={`flex-1 p-4 border rounded-2xl cursor-pointer transition-all ${newTaskType === '测评' ? 'border-rose-500 bg-rose-50 shadow-md ring-1 ring-rose-500' : 'border-slate-200 hover:bg-slate-50'}`}>
                         <input type="radio" className="sr-only" checked={newTaskType === '测评'} onChange={() => setNewTaskType('测评')} />
                         <div className="flex items-center gap-3">
                           <div className={`w-12 h-12 rounded-xl flex items-center justify-center shrink-0 ${newTaskType === '测评' ? 'bg-rose-500 text-white shadow-inner' : 'bg-slate-100 text-slate-400'}`}><Icon name="psychology" style={{fontSize: '24px'}}/></div>
                           <div><p className={`font-black text-sm mb-0.5 ${newTaskType === '测评' ? 'text-rose-900' : 'text-slate-700'}`}>心理测评</p><p className={`text-[10px] ${newTaskType === '测评' ? 'text-rose-600' : 'text-slate-500'}`}>DASS-21 等专业量表</p></div>
                         </div>
                       </label>
                       <label className={`flex-1 p-4 border rounded-2xl cursor-pointer transition-all ${newTaskType === '其他问卷' ? 'border-emerald-500 bg-emerald-50 shadow-md ring-1 ring-emerald-500' : 'border-slate-200 hover:bg-slate-50'}`}>
                         <input type="radio" className="sr-only" checked={newTaskType === '其他问卷'} onChange={() => setNewTaskType('其他问卷')} />
                         <div className="flex items-center gap-3">
                           <div className={`w-12 h-12 rounded-xl flex items-center justify-center shrink-0 ${newTaskType === '其他问卷' ? 'bg-emerald-500 text-white shadow-inner' : 'bg-slate-100 text-slate-400'}`}><Icon name="fact_check" style={{fontSize: '24px'}}/></div>
                           <div><p className={`font-black text-sm mb-0.5 ${newTaskType === '其他问卷' ? 'text-emerald-900' : 'text-slate-700'}`}>其他问卷</p><p className={`text-[10px] ${newTaskType === '其他问卷' ? 'text-emerald-600' : 'text-slate-500'}`}>自定义调研、表单等</p></div>
                         </div>
                       </label>
                     </div>
                     <div className="space-y-5">
                       <div>
                         <label className="block text-xs font-bold text-slate-500 mb-1.5">标题 <span className="text-rose-500">*</span></label>
                         <input type="text" placeholder={newTaskType === '作业' ? "例如：课程后段期末总结短文" : newTaskType === '测评' ? "例如：期中阶段心理健康普查" : "例如：期中教学质量满意度调研问卷"} className={`w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none font-bold focus:ring-2 transition-all ${newTaskType === '作业' ? 'focus:ring-indigo-500' : newTaskType === '测评' ? 'focus:ring-rose-500' : 'focus:ring-emerald-500'}`} />
                       </div>
                       
                       {newTaskType === '测评' && (
                         <div>
                           <label className="block text-xs font-bold text-slate-500 mb-1.5">量表选择 <span className="text-rose-500">*</span></label>
                           <select className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-rose-500 outline-none transition-all font-bold cursor-pointer">
                             <option>DASS-21 情绪自评量表</option><option>PHQ-9 抑郁症筛查量表</option><option>GAD-7 焦虑症筛查量表</option><option>SCL-90 症状自评量表</option>
                           </select>
                         </div>
                       )}

                       {newTaskType === '其他问卷' && (
                         <div>
                           <label className="block text-xs font-bold text-slate-500 mb-1.5">选择问卷模板 <span className="text-rose-500">*</span></label>
                           <select className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-emerald-500 outline-none transition-all font-bold cursor-pointer">
                             <option>教学质量反馈调研</option><option>期中学习状态自评</option><option>课程满意度评价表</option><option>使用外部表单 (请在下方填入链接)</option>
                           </select>
                         </div>
                       )}

                       <div className="grid grid-cols-2 gap-5">
                         <div><label className="block text-xs font-bold text-slate-500 mb-1.5">截止日期与时间 <span className="text-rose-500">*</span></label><input type="datetime-local" className={`w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 outline-none transition-all ${newTaskType === '作业' ? 'focus:ring-indigo-500' : newTaskType === '测评' ? 'focus:ring-rose-500' : 'focus:ring-emerald-500'}`} /></div>
                         <div><label className="block text-xs font-bold text-slate-500 mb-1.5">发送对象</label><select className="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none"><option>当前班级 ({MOCK_DATA.kpis.totalStudents}人)</option></select></div>
                       </div>
                       
                       <div>
                         <label className="block text-xs font-bold text-slate-500 mb-1.5">{newTaskType === '作业' ? '作业要求与说明' : newTaskType === '测评' ? '测评导语' : '问卷说明与链接'}</label>
                         <textarea rows="3" placeholder={newTaskType === '作业' ? "请输入具体的字数要求、格式要求..." : newTaskType === '测评' ? "请输入引导语，安抚学生情绪..." : "在此输入说明或直接粘贴外部问卷链接..."} className={`w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-2 outline-none transition-all resize-none ${newTaskType === '作业' ? 'focus:ring-indigo-500' : newTaskType === '测评' ? 'focus:ring-rose-500' : 'focus:ring-emerald-500'}`}></textarea>
                       </div>
                     </div>
                     <div className="flex gap-3 pt-6 mt-6 border-t border-slate-100">
                       <button onClick={() => setShowNewTaskModal(false)} className="flex-1 py-3 bg-slate-100 text-slate-600 rounded-xl font-bold hover:bg-slate-200 transition-colors">取消</button>
                       <button onClick={() => setShowTaskPublishConfirm(true)} className={`flex-1 py-3 text-white rounded-xl font-bold shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2 ${newTaskType === '作业' ? 'bg-indigo-600 shadow-indigo-200 hover:bg-indigo-700' : newTaskType === '测评' ? 'bg-rose-500 shadow-rose-200 hover:bg-rose-600' : 'bg-emerald-500 shadow-emerald-200 hover:bg-emerald-600'}`}><Icon name="send" style={{fontSize: '18px'}}/> 确认下发至小程序</button>
                     </div>
                  </div>
               </div>
            </div>
          )}

          {showTaskPublishConfirm && (
            <div className="fixed inset-0 z-[80] flex items-center justify-center bg-slate-900/60 p-8 backdrop-blur-sm">
               <div className="bg-white w-[420px] rounded-3xl shadow-2xl overflow-hidden animate-in zoom-in-95 duration-200">
                  <div className="p-6 bg-slate-50 border-b border-slate-100 flex justify-between items-center">
                    <h2 className="font-black text-slate-800 flex items-center gap-2"><Icon name="help" className="text-slate-500" /> 发布确认</h2>
                    <button onClick={() => setShowTaskPublishConfirm(false)}><Icon name="close" className="text-slate-400 hover:text-slate-600 transition-colors" /></button>
                  </div>
                  <div className="p-8">
                    <p className="text-sm text-slate-600 mb-6 leading-relaxed">确定要正式下发该<strong className={`font-bold ${newTaskType === '作业' ? 'text-indigo-600' : newTaskType === '测评' ? 'text-rose-600' : 'text-emerald-600'}`}>{newTaskType}</strong>吗？</p>
                    <div className="flex gap-3">
                      <button onClick={() => setShowTaskPublishConfirm(false)} className="flex-1 py-3 bg-slate-100 text-slate-600 rounded-xl font-bold hover:bg-slate-200 transition-all">取消</button>
                      <button onClick={() => { setShowTaskPublishConfirm(false); setShowNewTaskModal(false); alert("发布成功！"); }} className={`flex-1 py-3 text-white rounded-xl font-bold shadow-lg active:scale-95 transition-all ${newTaskType === '作业' ? 'bg-indigo-600 hover:bg-indigo-700 shadow-indigo-200' : newTaskType === '测评' ? 'bg-rose-600 hover:bg-rose-700 shadow-rose-200' : 'bg-emerald-600 hover:bg-emerald-700 shadow-emerald-200'}`}>确认发布</button>
                    </div>
                  </div>
               </div>
            </div>
          )}
        </div>
      );
    };

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
